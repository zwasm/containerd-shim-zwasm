name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    name: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2

      - name: Install Zig
        uses: goto-bus-stop/setup-zig@abea47f85e598557f500fa1fd2ab7464fcb39406 # v2.2.1
        with:
          version: 0.16.0

      - name: cargo fmt
        run: cargo fmt --all -- --check

      - name: cargo clippy
        run: cargo clippy --all-targets --all-features -- -D warnings

      - name: Build
        run: cargo build --all-targets

      # `--lib` alone also picks up `src/tests.rs`, which needs root. Those run
      # in the `integration` job instead.
      - name: Unit tests
        run: cargo test --lib instance::tests

      - name: Doc tests
        run: cargo test --doc

  integration:
    name: integration
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2

      - name: Install Zig
        uses: goto-bus-stop/setup-zig@abea47f85e598557f500fa1fd2ab7464fcb39406 # v2.2.1
        with:
          version: 0.16.0

      # Build unprivileged so the compile artifacts stay owned by the runner
      # user and the cache can pick them up.
      - name: Build tests
        run: cargo build --tests

      # `WasiTest` creates an OCI bundle and runs the shim against it, which
      # needs root. `-E` keeps the toolchain environment that rustup set up.
      - name: Integration tests
        run: sudo -E "$(command -v cargo)" test --lib

  # No cross-compilation job yet. This crate takes zwasm-sdk from crates.io, and
  # the build script that compiles the zwasm C library only ever builds it for
  # the host, so a cross build produces an archive that cannot link. That is
  # fixed in the SDK's own build script and verified by the SDK's CI; a job here
  # can only go green once this crate depends on the release that carries the
  # fix.

  # Single required status check for the branch ruleset. Point the ruleset at
  # `ci-required`, not at the individual jobs, so the job list can change
  # without a settings change. `always()` so this job still reports a result
  # when a dependency fails or is cancelled: a required check that never reports
  # would block every pull request.
  ci-required:
    name: ci-required
    needs: [test, integration]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Verdict
        env:
          TEST_RESULT: ${{ needs.test.result }}
          INTEGRATION_RESULT: ${{ needs.integration.result }}
        shell: bash
        run: |
          set -euo pipefail
          failed=0
          for job in TEST INTEGRATION; do
            eval "result=\$${job}_RESULT"
            if [ "$result" != "success" ]; then
              echo "::error::$job did not pass (result=$result)"
              failed=1
            fi
          done
          [ "$failed" -eq 0 ] || exit 1
          echo "every job passed"
